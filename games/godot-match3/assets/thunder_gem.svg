<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="electricBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="1" />
      <stop offset="60%" stop-color="#4361ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#14082e" stop-opacity="1" />
    </radialGradient>
    
    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fff275" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Gem -->
  <rect x="8" y="8" width="84" height="84" rx="22" ry="22" fill="url(#electricBg)" stroke="#80d9ff" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Outer Energy Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#64dfdf" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>

  <!-- Zeus Lightning Bolt Glyph -->
  <polygon points="56,16 32,52 50,52 42,84 72,46 53,46" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
</svg>
